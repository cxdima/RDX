[project]
name = "rdx-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "numpy>=2,<3", "scipy>=1.15,<2", "soundfile>=0.13,<1",
  "librosa>=0.11,<1", "mido>=1.3,<2", "music21>=9,<10",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
train = ["mlx-lm[train]>=0.26,<1", "huggingface-hub>=0.34,<2"]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rdx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
